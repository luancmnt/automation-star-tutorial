openapi: 3.0.3
info:
  title: E-commerce Checkout API
  description: REST API for register, login, cart, and checkout with an in-memory store.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Auth
  - name: Cart
  - name: Checkout
  - name: Docs
paths:
  /register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Dana Lee
              email: dana@example.com
              password: dana123
      responses:
        '201':
          description: User registered
        '400':
          description: Invalid request body
        '409':
          description: Email already registered
  /login:
    post:
      tags: [Auth]
      summary: Login with an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: alice123
      responses:
        '200':
          description: Login successful
        '400':
          description: Missing credentials
        '401':
          description: Invalid credentials
  /cart:
    post:
      tags: [Cart]
      summary: Replace the authenticated user's cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
            example:
              items:
                - productId: prod-1
                  quantity: 1
                - productId: prod-2
                  quantity: 2
      responses:
        '200':
          description: Cart updated
        '400':
          description: Invalid cart payload
        '401':
          description: Missing or invalid token
        '404':
          description: Product not found
  /checkout:
    post:
      tags: [Checkout]
      summary: Checkout the current cart
      description: Cash payments receive a 10% discount. Credit card payments receive no discount.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            examples:
              cash:
                value:
                  paymentMethod: cash
              creditCard:
                value:
                  paymentMethod: credit_card
      responses:
        '201':
          description: Checkout completed
        '400':
          description: Empty cart or invalid payment method
        '401':
          description: Missing or invalid token
  /openapi.yaml:
    get:
      tags: [Docs]
      summary: Download the OpenAPI specification as YAML
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [Docs]
      summary: Render the OpenAPI specification in Swagger UI
      responses:
        '200':
          description: Swagger UI HTML page
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CartRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1
    CheckoutRequest:
      type: object
      required: [paymentMethod]
      properties:
        paymentMethod:
          type: string
          enum: [cash, credit_card]
